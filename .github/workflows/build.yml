name: Monthly build

# Builds every state, publishes the files as a release, and redraws the
# coverage map. Runs on the first of each month, after the month's Overture
# release, and by hand from the Actions tab.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions to build, space separated (blank for every state). A partial run is a test: it publishes nothing."
        required: false
        default: ""

permissions:
  contents: write

env:
  DUCKDB_VERSION: v1.5.4
  ALMANAC_CONTACT: "scheduled build"

jobs:
  prepare:
    runs-on: ubuntu-latest
    # the first run geocodes about a million addresses; later runs reuse the answers
    timeout-minutes: 240
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
      build_date: ${{ steps.plan.outputs.build_date }}
      overture: ${{ steps.plan.outputs.overture }}
      atp: ${{ steps.plan.outputs.atp }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/duckdb_cli-linux-amd64.zip"
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/ && rm duckdb.zip
          duckdb -c "install httpfs; install spatial;"
      - name: Plan
        id: plan
        # One release of each base source for the whole run, so every state is built from the same data.
        run: |
          source lib/common.sh
          if [ -n "${{ inputs.regions }}" ]; then
            regions="$(printf '%s\n' ${{ inputs.regions }} | jq -R . | jq -cs .)"
          else
            regions="$(awk -F'\t' '!/^#/ && $7 != "" && $7 != "-" {print $1}' regions.tsv | jq -R . | jq -cs .)"
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "overture=$(curl -fsS -A "$UA" 'https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/&delimiter=/' | tr '<' '\n' | sed -n 's|^Prefix>release/\(.*\)/$|\1|p' | sort | tail -1)" >> "$GITHUB_OUTPUT"
          echo "atp=$(curl -fsS -A "$UA" https://data.alltheplaces.xyz/runs/latest.json | jq -r .run_id)" >> "$GITHUB_OUTPUT"
      # Geocoder answers from earlier runs, so each month only new addresses are asked about.
      - uses: actions/cache@v4
        with:
          path: data/cache/geocode
          key: geocode-${{ github.run_id }}
          restore-keys: geocode-
      # Last run's register files. If a source is down this month, its last file is used again.
      - uses: actions/cache@v4
        with:
          path: data/cache/evidence
          key: evidence-${{ github.run_id }}
          restore-keys: evidence-
      # Address points from county and state layers, and the Census ZIP code areas. Each layer
      # is fetched again when it is three months old (base/address_layers.py).
      - uses: actions/cache@v4
        with:
          path: |
            data/cache/addresses
            data/cache/census/zcta.parquet
          key: addresses-${{ github.run_id }}
          restore-keys: addresses-
      - name: Bring forward the held records from the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/cache/held
          gh release download --pattern held.tar.gz --dir . 2>/dev/null && tar -xzf held.tar.gz -C data/cache/held || echo "no held records yet"
      - name: Fetch national files
        env:
          ATP_RUN: ${{ steps.plan.outputs.atp }}
        run: ./prepare.sh
      - name: Keep what the state jobs need
        run: |
          mkdir -p shared/atp shared/census
          cp -R data/cache/evidence shared/
          [ -d data/cache/addresses ] && cp -R data/cache/addresses shared/ || true
          mv data/cache/fsq shared/
          mv data/cache/atp/us-*.parquet shared/atp/
          mv data/cache/census/states.parquet shared/census/
          tar -czf held.tar.gz -C data/cache/held .
          cp data/cache/watch/sources.txt source-watch.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: held
          path: |
            held.tar.gz
            source-watch.txt
          retention-days: 3

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # go easy on the servers the OSM extracts come from
      max-parallel: 10
      matrix:
        region: ${{ fromJson(needs.prepare.outputs.regions) }}
    env:
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      OVERTURE_RELEASE: ${{ needs.prepare.outputs.overture }}
      ATP_RUN: ${{ needs.prepare.outputs.atp }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # a hung package mirror once held four states for two hours
        timeout-minutes: 20
        run: |
          install() {
            sudo timeout 300 apt-get update -qq && sudo timeout 300 apt-get install -y -qq osmium-tool &&
            curl -fsSL --max-time 300 -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/duckdb_cli-linux-amd64.zip" &&
            unzip -oq duckdb.zip && sudo mv duckdb /usr/local/bin/ && rm duckdb.zip &&
            timeout 300 duckdb -c "install httpfs; install spatial;"
          }
          install || { sleep 60; install; }
      - uses: actions/download-artifact@v4
        with:
          name: shared
          path: data/cache
      - name: Build
        run: |
          # one more try after a pause, for a download that failed
          ./build.sh "${{ matrix.region }}" || { sleep 300; ./build.sh "${{ matrix.region }}"; }
          mkdir -p reports && ./stats.sh "${{ matrix.region }}" > "reports/${{ matrix.region }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.region }}
          path: |
            data/out/
            reports/${{ matrix.region }}.txt
          retention-days: 3

  publish:
    needs: [prepare, build]
    # A state that failed is left out of the release rather than blocking it.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: held
          path: data/out
      - name: List what was built
        run: |
          ls data/out | head -200
          jq -s '{dataset: "Vela Almanac", license: "ODbL-1.0",
                  credit: .[0].credit, notice: .[0].notice,
                  build_date: .[0].build_date, sources: .[0].sources,
                  regions: [.[] | {region, country, iso_3166_2, osm_extracts, bbox, files}]}' data/out/manifest-*.json > data/out/manifest.json
          jq -r '"\(.regions | length) regions, build \(.build_date)"' data/out/manifest.json
      - name: Compare with the last release
        if: ${{ inputs.regions == '' }}
        run: |
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/duckdb_cli-linux-amd64.zip"
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/ && rm duckdb.zip
          mkdir -p prev
          # the newest release that is not today's build
          last="$(gh release list --limit 10 --json tagName -q '.[].tagName' | grep -v "^$BUILD_DATE$" | head -1 || true)"
          if [ -n "$last" ] && gh release download "$last" --pattern 'status-*.parquet' --dir prev 2>/dev/null && ls prev/status-*.parquet >/dev/null 2>&1; then
            duckdb -c "set variable prev = 'prev'; set variable cur = 'data/out';" -c ".read tools/changes.sql"
            echo "Changes since $last:"; cat data/out/changes-summary.csv
          else
            echo "no earlier release with status files; nothing to compare"
          fi
      - name: Release
        if: ${{ inputs.regions == '' }}
        run: |
          notes="Vela Almanac build of $BUILD_DATE. One core and one places file per state, plus manifests. Credit and source notices: https://github.com/${{ github.repository }}/blob/main/NOTICE"
          # say which states and sources, if any, are not from this month
          want="$(awk -F'\t' '!/^#/ && $7 != "" && $7 != "-" {print $1}' regions.tsv | sort)"
          have="$(ls data/out | sed -n 's/^manifest-\(.*\)\.json$/\1/p' | sort)"
          missing="$(comm -23 <(echo "$want") <(echo "$have") | tr '\n' ' ')"
          [ -z "${missing// }" ] || notes="$notes"$'\n\n'"States that failed to build and are not in this release: $missing"
          if grep -q CHECK data/out/source-watch.txt 2>/dev/null; then
            notes="$notes"$'\n\n'"Sources to check:"$'\n'"$(grep CHECK data/out/source-watch.txt)"
          fi
          if gh release view "$BUILD_DATE" >/dev/null 2>&1; then
            gh release upload "$BUILD_DATE" data/out/* --clobber
            gh release edit "$BUILD_DATE" --notes "$notes"
          else
            gh release create "$BUILD_DATE" data/out/* --title "$BUILD_DATE" --notes "$notes"
          fi
      - name: Redraw the coverage map
        # only from a complete build, so a state that failed does not vanish from the map
        if: ${{ inputs.regions == '' && needs.build.result == 'success' }}
        run: |
          python3 tools/coverage_map.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs COVERAGE.md reports
          git diff --cached --quiet || git commit -m "Coverage and reports for the $BUILD_DATE build"
          # someone may have pushed while the build ran; where both touched a
          # report, the one from this build wins
          git pull --rebase -X theirs origin main
          git push
